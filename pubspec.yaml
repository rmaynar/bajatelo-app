name: bajatelo_app
description: Universal Video & Audio Downloader — Fast, Private & Free
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Platform-specific directories and file access
  path_provider: ^2.1.2

  # Android storage permissions
  permission_handler: ^11.3.0

  # Thumbnail caching
  cached_network_image: ^3.3.1

  # i18n date/number formatting
  intl: ^0.20.3

  # Plus Jakarta Sans font
  google_fonts: ^6.1.0

  # Share downloaded files
  share_plus: ^13.3.0

  # Persist settings (language, download history)
  shared_preferences: ^2.2.2

  device_info_plus: ^13.2.0
  http: ^1.6.0
  path: ^1.9.1
  archive: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  # Assets are added in Phase 2 (yt-dlp/ffmpeg binaries).
  # Fonts are loaded via google_fonts package — no local font files needed.
